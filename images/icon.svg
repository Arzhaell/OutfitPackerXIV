<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icône du plugin : un seul cintre qui porte plusieurs tenues (les pièces regroupées en un ensemble), avec deux
       étincelles pour le mirage. Même fond que les autres plugins. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22324f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a77bf5"/>
      <stop offset="1" stop-color="#6a3fd0"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd6c9"/>
      <stop offset="1" stop-color="#2a8f9c"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f27ab8"/>
      <stop offset="1" stop-color="#b9407f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="1" stop-color="#e0a93b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- Une tunique accrochée au cintre (épaules à y = 238). -->
    <path id="tunic" d="M 200 238 L 312 238 L 376 272 L 360 320 L 328 306 L 328 430 Q 328 442 316 442 L 196 442
                        Q 184 442 184 430 L 184 306 L 152 320 L 136 272 Z"/>
  </defs>

  <!-- Fond -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#background)"/>

  <!-- Deux tenues derrière, en éventail -->
  <use href="#tunic" fill="url(#left)" transform="rotate(-16 256 238)" filter="url(#shadow)"/>
  <use href="#tunic" fill="url(#right)" transform="rotate(16 256 238)" filter="url(#shadow)"/>

  <!-- La tenue de devant, avec son col -->
  <use href="#tunic" fill="url(#front)" filter="url(#shadow)"/>
  <path d="M 226 238 L 256 276 L 286 238" fill="none" stroke="#2a1b5c" stroke-width="10" stroke-linejoin="round"/>
  <!-- Couleur pleine : un dégradé sur une ligne droite (boîte de hauteur nulle) ne se dessine pas. -->
  <path d="M 184 396 H 328" stroke="#e8b84a" stroke-width="10"/>

  <!-- Cintre -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M 256 160 V 140 C 256 124 280 120 280 98 C 280 82 268 70 254 70 C 240 70 230 80 230 94" stroke-width="14"/>
    <path d="M 256 160 L 122 236 H 390 Z" stroke-width="16"/>
  </g>

  <!-- Étincelles du mirage -->
  <g fill="#fff6c9">
    <path d="M 108 92 L 118 122 L 148 132 L 118 142 L 108 172 L 98 142 L 68 132 L 98 122 Z"/>
    <path d="M 404 96 L 411 116 L 431 123 L 411 130 L 404 150 L 397 130 L 377 123 L 397 116 Z"/>
  </g>
</svg>
